name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional. The memory layer depends on atomic file
        # replacement, which behaves differently here, and a maintainer
        # develops on Windows. Cross-platform file handling is not
        # verifiable any other way.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: setup refuses Bun older than 1.3.3, which would let
          # compiled tools read a project's .env.
          bun-version: "1.4.3"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun x tsc --noEmit

      - name: Validate catalogue
        run: bun run src/cli.ts validate

      - name: Tests
        run: bun test

      # Part XX 80: a failing invariant is a build failure, not a logged
      # warning. Runs on every platform in the matrix, because the write
      # protocol's guarantees rest on filesystem primitives that differ between
      # them -- see docs/platform-atomicity.md.
      - name: Memory invariants
        run: bun run src/cli.ts memory doctor

      - name: Generated files are current
        shell: bash
        run: |
          # Derived artifacts are committed so reviewers can diff them.
          # If a role changed without regenerating, the diff below is the
          # proof, and it fails here rather than rotting silently.
          bun run src/cli.ts roles --markdown > se/agents/role-inventory.md
          bun run src/cli.ts ownership --markdown > se/agents/ownership-matrix.md
          if ! git diff --quiet -- se/agents/role-inventory.md se/agents/ownership-matrix.md; then
            echo "::error::Generated files are stale. Run: bun run gen"
            git --no-pager diff -- se/agents/role-inventory.md se/agents/ownership-matrix.md
            exit 1
          fi

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reject placeholders in the specification
        run: |
          # Part IV 7.1: empty placeholders and TODO are defects, not
          # work-in-progress markers.
          if grep -rInE '\b(TODO|TBD|FIXME)\b' se/ 2>/dev/null; then
            echo "::error::Placeholder markers found under se/."
            exit 1
          fi
          echo "no placeholders"

      - name: Reject near-empty specification files
        run: |
          fail=0
          while IFS= read -r f; do
            words=$(wc -w < "$f")
            if [ "$words" -lt 40 ]; then
              echo "::error file=$f::Only $words words; a stub is not a specification."
              fail=1
            fi
          done < <(find se -name '*.md' -not -name 'role-inventory.md' -not -name 'ownership-matrix.md')
          exit $fail

      - name: Relative links resolve
        shell: bash
        run: |
          fail=0
          while IFS= read -r f; do
            dir=$(dirname "$f")
            # Markdown links that are neither absolute URLs nor anchors. grep exits 1
            # on a file with no links; under pipefail that must not fail the step.
            { grep -oE '\]\([^)#][^)]*\)' "$f" 2>/dev/null || true; } | sed -E 's/^\]\(//; s/\)$//' | while read -r link; do
              case "$link" in
                http*|mailto:*) continue ;;
              esac
              target="${link%%#*}"
              [ -z "$target" ] && continue
              if [ ! -e "$dir/$target" ] && [ ! -e "$target" ]; then
                echo "::error file=$f::Broken relative link: $target"
                exit 1
              fi
            done || fail=1
          done < <(find se docs -name '*.md' 2>/dev/null)
          exit $fail

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
